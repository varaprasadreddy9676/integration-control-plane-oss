name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A push that supersedes an in-flight run makes the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installs were failing whole runs on transient registry resets (ECONNRESET).
  # Retry instead of going red on a blip.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"
  NPM_CONFIG_FUND: "false"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/test/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install test dependencies
        working-directory: backend/test
        run: npm ci

      - name: Run backend tests
        working-directory: backend/test
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/test/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Biome check
        working-directory: backend
        run: npm run check

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Biome check
        working-directory: frontend
        run: npm run check

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # Plants tagged secrets in a fresh install and fails if any API response
  # gives one back. See tools/leak-audit/README.md.
  leak-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Start a fresh install
        env:
          # The audit makes ~1,500 requests; the default limit would only slow it down.
          API_RATE_LIMIT_ENABLED: "false"
        run: |
          ./scripts/init-env.sh
          docker compose up -d --build mongodb backend
          for i in $(seq 1 90); do curl -sf http://localhost:3545/ >/dev/null && break; sleep 2; done
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          docker compose exec -T backend node scripts/create-user.js \
            --email audit@example.com --password "$password" --role SUPER_ADMIN

      - name: Run the credential leak audit
        env:
          ADMIN_EMAIL: audit@example.com
        run: node tools/leak-audit/audit.mjs

      - name: Show backend logs
        if: failure()
        run: docker compose logs backend --tail 200

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"

      # npm audit reads the lockfile directly, so no install is needed.
      - name: Block critical backend production vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      # Production still runs Node 14. Nodemailer 10 and node-cron 4 require
      # Node 20, so high-severity findings remain visible until that runtime
      # migration is completed.
      - name: Report high backend production vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
